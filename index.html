<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0c0e" id="lgThemeColor">
<title>Catálogo</title>
<meta name="description" content="Catálogo de joias — escolha e peça pelo WhatsApp">
<style>
/* dois temas, iguais aos do painel de gestão: data-tema no <html> decide.
   PRATA = preto + cromado (as cores da logo). OURO = a paleta original. */
:root{
  --bg:#0b0c0e; --painel:#14161a; --painel2:#1c1f25; --painel3:#262a32; --borda:#343943;
  --acento:#c3cad6; --acento2:#e9eef5; --texto:#f2f4f8; --texto2:#9ba3b2; --texto3:#6a7180;
  --vermelho:#e8676b; --topo1:#15171c; --topo2:#0d0f12; --btTx:#14161a;
}
:root[data-tema="ouro"]{
  --bg:#16120d; --painel:#211b13; --painel2:#2a2318; --painel3:#322a1c; --borda:#3a3122;
  --acento:#d4a94b; --acento2:#e8c877; --texto:#f0e9da; --texto2:#b3a88f; --texto3:#6d6650;
  --vermelho:#e0605c; --topo1:#1d1710; --topo2:#181309; --btTx:#16120d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--texto);font-family:"Segoe UI",system-ui,Arial,sans-serif}
a{color:inherit}
/* ---- topo: marca à esquerda, MATERIAIS centralizados, busca à direita ---- */
.topo{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--topo1),var(--topo2));border-bottom:1px solid var(--borda)}
.topo-linha{display:flex;align-items:center;gap:.8rem;padding:.7rem 1rem;max-width:1400px;margin:0 auto}
.marca{display:flex;align-items:center;gap:.7rem;flex:none}
.marca img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:1px solid var(--borda);background:#000}
.marca h1{font-size:1.1rem;color:var(--acento2);margin:0;letter-spacing:.4px;white-space:nowrap}
.busca-wrap{flex:1;min-width:120px;display:flex;justify-content:flex-end}
.busca-wrap input{width:100%;max-width:280px;background:var(--painel);border:1px solid var(--borda);color:var(--texto);border-radius:10px;padding:.5rem .8rem;font-size:.92rem}
.busca-wrap input:focus{outline:1px solid var(--acento);border-color:var(--acento)}
.bt-menu{flex:none;background:var(--painel);border:1px solid var(--borda);color:var(--texto);border-radius:9px;padding:.45rem .7rem;font-size:1rem;cursor:pointer;display:none}
/* materiais (AÇO, FOLHEADO...) — centralizados, é o menu principal */
.chips{display:flex;gap:.45rem;justify-content:center;flex-wrap:wrap;padding:0 1rem .7rem}
.chips button{background:var(--painel);border:1px solid var(--borda);color:var(--texto2);border-radius:20px;padding:.4rem 1rem;font-size:.84rem;white-space:nowrap;cursor:pointer;letter-spacing:.3px}
.chips button:hover{border-color:var(--acento)}
.chips button.ativo{background:var(--painel2);border-color:var(--acento);color:var(--acento2);font-weight:600}
/* ---- corpo: coleções na lateral ESQUERDA + grade de produtos ---- */
.corpo-loja{display:flex;gap:1.2rem;max-width:1400px;margin:0 auto;padding:1rem 1rem 6rem;align-items:flex-start}
.lateral{flex:none;width:190px;position:sticky;top:118px}
.lateral h2{font-size:.76rem;text-transform:uppercase;letter-spacing:1px;color:var(--texto3);margin:0 0 .6rem;font-weight:600}
.lateral button{display:flex;justify-content:space-between;align-items:center;gap:.4rem;width:100%;text-align:left;background:none;border:none;border-left:2px solid transparent;color:var(--texto2);padding:.45rem .6rem;font-size:.88rem;cursor:pointer;border-radius:0 6px 6px 0}
.lateral button:hover{background:var(--painel);color:var(--texto)}
.lateral button.ativo{background:var(--painel2);border-left-color:var(--acento);color:var(--acento2);font-weight:600}
.lateral button i{font-style:normal;font-size:.72rem;color:var(--texto3)}
/* precisa ser mais específico que ".lateral button" acima, senão o display:flex
   daquela regra ganha e o botão de fechar aparece no desktop também */
.lateral button.lateral-fechar{display:none}
.grade{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem;min-width:0}
@media(min-width:700px){.grade{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1050px){.grade{grid-template-columns:repeat(4,1fr)}}
/* celular: a lateral virou gaveta (não cabe sidebar fixa em 375px) */
@media(max-width:699px){
  .bt-menu{display:block}
  .marca h1{font-size:.98rem}
  .corpo-loja{padding:.7rem .8rem 6rem}
  .lateral{position:fixed;inset:0 auto 0 0;width:76%;max-width:280px;z-index:60;background:var(--painel);border-right:1px solid var(--borda);padding:1rem;overflow-y:auto;transform:translateX(-100%);transition:transform .22s}
  .lateral.aberta{transform:none}
  .lateral button.lateral-fechar{display:block;background:var(--painel2);border:1px solid var(--borda);color:var(--texto);border-radius:8px;padding:.35rem .6rem;font-size:.85rem;cursor:pointer;margin-bottom:.8rem;width:100%;text-align:center;border-left:1px solid var(--borda)}
  .fundo-lateral{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;display:none}
  .fundo-lateral.show{display:block}
}
.prodcard{background:var(--painel);border:1px solid var(--borda);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s}
.prodcard:hover{border-color:var(--acento)}
.prodcard .foto{width:100%;aspect-ratio:1/1;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.prodcard .foto img{width:100%;height:100%;object-fit:cover}
/* prévia: a 2ª foto fica por cima, invisível, e aparece ao passar o mouse.
   Só em telas que têm ponteiro de verdade — no celular hover "gruda" e a peça
   ficaria mostrando a segunda foto pra sempre depois de um toque. */
.prodcard .foto .previa{position:absolute;inset:0;opacity:0;transition:opacity .25s}
@media (hover:hover){.prodcard:hover .foto .previa{opacity:1}}
.prodcard .semfoto{font-size:2rem;opacity:.3}
.ribbon{position:absolute;top:.5rem;left:0;background:var(--vermelho);color:#fff;font-size:.68rem;padding:.15rem .6rem;border-radius:0 6px 6px 0;z-index:2}
.prodcard .info{padding:.55rem .65rem .7rem}
.prodcard .nome{font-size:.86rem;font-weight:600;line-height:1.25;margin-bottom:.15rem}
.prodcard .cat{font-size:.7rem;color:var(--texto2)}
.prodcard .cols{font-size:.66rem;color:var(--texto3);margin-top:.15rem}
.prodcard .preco{font-size:.98rem;color:var(--acento2);font-weight:700;margin-top:.3rem}
.vazio{grid-column:1/-1;padding:3rem 1rem;text-align:center;color:var(--texto2)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:100}
.overlay.show{display:flex}
@media(min-width:640px){.overlay{align-items:center}}
.modal{background:var(--painel);border:1px solid var(--borda);border-radius:16px 16px 0 0;max-width:480px;width:100%;max-height:92vh;overflow-y:auto}
@media(min-width:640px){.modal{border-radius:16px}}
.modal .fechar{position:sticky;top:.5rem;float:right;margin-right:.5rem;background:rgba(0,0,0,.5);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:1.1rem;cursor:pointer;z-index:5}
.carrossel{width:100%;aspect-ratio:1/1;background:#000;position:relative;overflow:hidden;cursor:pointer}
.carrossel img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;opacity:0;transition:opacity .2s}
.carrossel img.show{opacity:1}
/* setas de navegação — sobre a foto, sempre legíveis porque a joia pode ser
   clara ou escura; por isso o fundo escuro fixo em vez de transparente */
.carrossel .seta{position:absolute;top:50%;transform:translateY(-50%);z-index:3;
  width:40px;height:52px;border:none;border-radius:8px;cursor:pointer;
  background:rgba(0,0,0,.55);color:#fff;font-size:1.9rem;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:background .15s}
.carrossel .seta:hover{background:rgba(0,0,0,.85)}
.carrossel .seta.ant{left:.4rem}
.carrossel .seta.prox{right:.4rem}
.dots{display:flex;gap:.3rem;justify-content:center;padding:.5rem}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--borda);cursor:pointer}
.dots span.on{background:var(--acento)}
.modal .corpo{padding:.4rem 1.1rem 1.3rem}
.modal .nome{font-size:1.1rem;font-weight:700;color:var(--texto);margin-bottom:.2rem}
.modal .preco{font-size:1.3rem;color:var(--acento2);font-weight:700;margin-bottom:.6rem}
.modal .tags{margin-bottom:.5rem}
.modal .tags span{display:inline-block;background:var(--painel2);border:1px solid var(--borda);border-radius:20px;padding:.1rem .6rem;font-size:.72rem;color:var(--texto2);margin:0 .25rem .25rem 0}
.modal .desc{font-size:.87rem;color:var(--texto2);line-height:1.5;margin-bottom:.8rem;white-space:pre-wrap}
.tam-wrap{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.9rem}
.tam-wrap button{background:var(--painel2);border:1px solid var(--borda);color:var(--texto);border-radius:8px;padding:.4rem .7rem;font-size:.85rem;cursor:pointer}
.tam-wrap button.on{border-color:var(--acento);color:var(--acento2);background:var(--painel3)}
.qtd-wrap{display:flex;align-items:center;gap:.7rem;margin-bottom:1rem}
.qtd-wrap button{width:34px;height:34px;border-radius:8px;background:var(--painel2);border:1px solid var(--borda);color:var(--texto);font-size:1.1rem;cursor:pointer}
.qtd-wrap span{font-size:1.05rem;font-weight:600;min-width:1.5rem;text-align:center}
.btgrande{width:100%;background:var(--acento);color:var(--btTx);border:none;border-radius:10px;padding:.8rem;font-size:.95rem;font-weight:700;cursor:pointer}
.btgrande:disabled{opacity:.4;cursor:not-allowed}
.btgrande.wpp{background:#25D366;color:#fff}
.esgot-aviso{background:var(--painel3);color:var(--vermelho);border-radius:8px;padding:.5rem .7rem;font-size:.82rem;margin-bottom:.8rem}
.fab{position:fixed;right:1rem;bottom:1rem;background:var(--acento);color:var(--btTx);border:none;border-radius:30px;padding:.8rem 1.2rem;font-weight:700;font-size:.9rem;box-shadow:0 4px 14px rgba(0,0,0,.5);cursor:pointer;display:none;align-items:center;gap:.5rem;z-index:50}
.fab.show{display:flex}
.fab .bolha{background:var(--bg);color:var(--acento2);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.75rem}
.carr-item{display:flex;gap:.6rem;align-items:center;border-bottom:1px solid var(--borda);padding:.6rem 0}
.carr-item img{width:52px;height:52px;object-fit:cover;border-radius:8px;background:#000}
.carr-item .nm{font-size:.85rem;font-weight:600}
.carr-item .tam{font-size:.75rem;color:var(--texto2)}
.carr-item .qtd{display:flex;align-items:center;gap:.4rem;margin-top:.25rem}
.carr-item .qtd button{width:22px;height:22px;border-radius:6px;background:var(--painel2);border:1px solid var(--borda);color:var(--texto);font-size:.85rem;line-height:1;cursor:pointer}
.carr-item .rm{background:none;border:none;color:var(--vermelho);font-size:1.2rem;cursor:pointer;padding:.2rem .4rem}
.carr-total{display:flex;justify-content:space-between;font-size:1rem;font-weight:700;padding:.8rem 0;border-top:1px solid var(--borda);margin-top:.4rem}
footer{text-align:center;padding:1.5rem 1rem 5rem;font-size:.75rem;color:var(--texto3)}
</style>
</head>
<body>
<div class="topo">
  <div class="topo-linha">
    <button class="bt-menu" id="lgBtMenu" aria-label="Coleções">☰</button>
    <div class="marca"><img id="lgLogo" src="" alt="" style="display:none"><h1 id="lgNome">Loja</h1></div>
    <div class="busca-wrap"><input id="lgBusca" placeholder="🔎 Buscar..."></div>
  </div>
  <div class="chips" id="lgChips"></div>
</div>
<div class="fundo-lateral" id="lgFundoLat"></div>
<div class="corpo-loja">
  <aside class="lateral" id="lgLateral">
    <button class="lateral-fechar" id="lgFecharLat">✕ fechar</button>
    <h2>Coleções</h2>
    <div id="lgColecoes"></div>
  </aside>
  <div class="grade" id="lgGrade"></div>
</div>
<footer id="lgRodape"></footer>

<div class="overlay" id="lgOverlay">
  <div class="modal">
    <button class="fechar" id="lgFechar">✕</button>
    <div class="carrossel" id="lgCarrossel"></div>
    <div class="dots" id="lgDots"></div>
    <div class="corpo">
      <div class="nome" id="lgMdNome"></div>
      <div class="preco" id="lgMdPreco"></div>
      <div class="tags" id="lgMdTags"></div>
      <div id="lgMdEsgotado"></div>
      <div class="desc" id="lgMdDesc"></div>
      <div id="lgMdTamWrap"></div>
      <div class="qtd-wrap"><button id="lgQtdMenos">−</button><span id="lgQtd">1</span><button id="lgQtdMais">+</button></div>
      <button class="btgrande" id="lgBtAdd">Adicionar ao pedido</button>
    </div>
  </div>
</div>

<div class="overlay" id="lgCarrinhoOverlay">
  <div class="modal">
    <button class="fechar" id="lgFecharCarr">✕</button>
    <div class="corpo">
      <div class="nome" style="margin-bottom:.8rem;margin-top:.6rem">🛒 Seu pedido</div>
      <div id="lgCarrItens"></div>
      <div class="carr-total"><span>Total estimado</span><span id="lgCarrTotal">R$ 0,00</span></div>
      <p style="font-size:.78rem;color:var(--texto2);margin-bottom:.8rem">Valores e disponibilidade são confirmados pelo WhatsApp antes de fechar.</p>
      <button class="btgrande wpp" id="lgBtEnviar">📱 Enviar pedido no WhatsApp</button>
    </div>
  </div>
</div>

<button class="fab" id="lgFab">🛒 Ver pedido <span class="bolha" id="lgFabN">0</span></button>

(function(){
  function $(i){ return document.getElementById(i); }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function fmtR(v){
    v=Number(v||0);
    var neg=v<0;v=Math.abs(v);
    var s=v.toFixed(2).split(".");
    var inteiro=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,".");
    return (neg?"-":"")+"R$ "+inteiro+","+s[1];
  }

  /* Estas variáveis precisam ser RELIDAS quando a vitrine atualizada chega do
     banco. Se ficarem presas ao catálogo embutido, o site continua mostrando a
     lista antiga mesmo tendo baixado a nova — que foi exatamente o que
     aconteceu: 111 produtos em memória e 110 desenhados na tela. */
  var loja, produtos, categorias, colecoes;
  function absorverCatalogo(){
    loja=CATALOGO.loja||{};
    produtos=(CATALOGO.produtos||[]).slice().sort(function(a,b){
      if(a.cat!==b.cat)return a.cat.localeCompare(b.cat,"pt-BR");
      return a.nome.localeCompare(b.nome,"pt-BR");
    });
    categorias=CATALOGO.categorias||[];
    colecoes=CATALOGO.colecoes||[];
  }
  absorverCatalogo();

  // tema escolhido no painel de gestão (prata = cores da logo)
  document.documentElement.setAttribute("data-tema", loja.tema==="ouro"?"ouro":"prata");
  var mt=$("lgThemeColor");
  if(mt)mt.setAttribute("content", loja.tema==="ouro"?"#16120d":"#0b0c0e");

  var estado={busca:"",cat:"",col:""};
  var atual=null,fotoIdx=0,tamSel="",qtd=1;

  var CHAVE_CARR="loja_carrinho_1001";
  var carrinho=[];
  try{carrinho=JSON.parse(localStorage.getItem(CHAVE_CARR)||"[]");}catch(e){carrinho=[];}
  function salvarCarrinho(){
    try{localStorage.setItem(CHAVE_CARR,JSON.stringify(carrinho));}catch(e){}
    atualizarFab();
  }

  document.title=(loja.nome||"Catálogo")+" — Catálogo";
  $("lgNome").textContent=loja.nome||"Catálogo";
  if(loja.logo){$("lgLogo").src=loja.logo;$("lgLogo").style.display="block";}
  var dataGer="";
  if(CATALOGO.geradoEm){var pd=CATALOGO.geradoEm.slice(0,10).split("-");dataGer=pd[2]+"/"+pd[1]+"/"+pd[0];}
  $("lgRodape").textContent="Catálogo de "+(loja.nome||"")+" — os valores e a disponibilidade são confirmados no WhatsApp. Atualizado em "+dataGer+".";

  function renderChips(){
    var h="<button class=\""+(estado.cat===""?"ativo":"")+"\" data-cat=\"\">Todos</button>";
    for(var i=0;i<categorias.length;i++){
      var c=categorias[i];
      h+="<button class=\""+(estado.cat===c?"ativo":"")+"\" data-cat=\""+esc(c)+"\">"+esc(c)+"</button>";
    }
    $("lgChips").innerHTML=h;
  }

  function renderColecoes(){
    var lat=$("lgLateral");
    if(!colecoes.length){ if(lat)lat.style.display="none"; return; }
    var h="<button class=\""+(estado.col===""?"ativo":"")+"\" data-col=\"\">Ver tudo</button>";
    for(var i=0;i<colecoes.length;i++){
      var c=colecoes[i];
      h+="<button class=\""+(estado.col===c.nome?"ativo":"")+"\" data-col=\""+esc(c.nome)+"\">"+
         "<span>"+esc(c.nome)+"</span><i>"+c.n+"</i></button>";
    }
    $("lgColecoes").innerHTML=h;
  }

  function produtosFiltrados(){
    var q=estado.busca.trim().toLowerCase();
    return produtos.filter(function(p){
      if(estado.cat&&p.cat!==estado.cat)return false;
      if(estado.col&&(p.cols||[]).indexOf(estado.col)<0)return false;
      if(q&&p.nome.toLowerCase().indexOf(q)<0)return false;
      return true;
    });
  }

  // gaveta das coleções (só no celular, onde não cabe a lateral fixa)
  function abrirLateral(){$("lgLateral").classList.add("aberta");$("lgFundoLat").classList.add("show");}
  function fecharLateral(){$("lgLateral").classList.remove("aberta");$("lgFundoLat").classList.remove("show");}

  function renderGrade(){
    var lista=produtosFiltrados();
    if(!lista.length){
      var oQue=estado.col?("a coleção \""+esc(estado.col)+"\""):"esse filtro";
      $("lgGrade").innerHTML="<div class=\"vazio\">Nada encontrado em "+oQue+".<br><br>"+
        "<button class=\"btgrande\" style=\"max-width:220px\" id=\"lgLimpar\">Ver todos os produtos</button></div>";
      var bl=$("lgLimpar");
      if(bl)bl.addEventListener("click",function(){estado.cat="";estado.col="";estado.busca="";$("lgBusca").value="";render();});
      return;
    }
    var h="";
    for(var i=0;i<lista.length;i++){
      var p=lista[i];
      /* A segunda foto entra sobreposta e só aparece no hover: é a prévia que
         mostra a peça de outro ângulo sem o cliente precisar abrir o produto.
         Em celular não há hover — lá ela simplesmente nunca aparece, e o
         primeiro toque já abre o detalhe, que é o comportamento esperado. */
      var foto=p.fotos&&p.fotos.length
        ?("<img src=\""+esc(p.fotos[0])+"\" alt=\"\" loading=\"lazy\">"
          +(p.fotos.length>1?"<img class=\"previa\" src=\""+esc(p.fotos[1])+"\" alt=\"\" loading=\"lazy\">":""))
        :"<div class=\"semfoto\">💍</div>";
      var cols=(p.cols&&p.cols.length)?("<div class=\"cols\">"+esc(p.cols.join(" · "))+"</div>"):"";
      h+="<div class=\"prodcard\" data-id=\""+esc(p.id)+"\">"+
           "<div class=\"foto\">"+(p.esgotado?"<span class=\"ribbon\">Esgotado</span>":"")+foto+"</div>"+
           "<div class=\"info\">"+
             "<div class=\"nome\">"+esc(p.nome)+"</div>"+
             "<div class=\"cat\">"+esc(p.cat||"")+(p.tipo?" · "+esc(p.tipo):"")+"</div>"+
             cols+
             "<div class=\"preco\">"+fmtR(p.preco)+"</div>"+
           "</div></div>";
    }
    $("lgGrade").innerHTML=h;
  }

  function render(){renderChips();renderColecoes();renderGrade();}

  $("lgChips").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    estado.cat=b.getAttribute("data-cat");render();
  });
  $("lgColecoes").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    estado.col=b.getAttribute("data-col");fecharLateral();render();
  });
  $("lgBtMenu").addEventListener("click",abrirLateral);
  $("lgFecharLat").addEventListener("click",fecharLateral);
  $("lgFundoLat").addEventListener("click",fecharLateral);
  $("lgBusca").addEventListener("input",function(){estado.busca=this.value;renderGrade();});
  $("lgGrade").addEventListener("click",function(e){
    var card=e.target.closest(".prodcard");if(!card)return;
    abrirModal(card.getAttribute("data-id"));
  });

  function acharProduto(id){
    for(var i=0;i<produtos.length;i++)if(produtos[i].id===id)return produtos[i];
    return null;
  }

  function abrirModal(id){
    var p=acharProduto(id);if(!p)return;
    atual=p;fotoIdx=0;qtd=1;
    tamSel=(p.variacoes&&p.variacoes.length)?p.variacoes[0]:"";
    renderModal();
    $("lgOverlay").classList.add("show");
  }
  function fecharModal(){$("lgOverlay").classList.remove("show");atual=null;}

  function renderModal(){
    var p=atual;
    var fotos=p.fotos&&p.fotos.length?p.fotos:[];
    var ch="";
    if(fotos.length){
      for(var i=0;i<fotos.length;i++)ch+="<img src=\""+esc(fotos[i])+"\" class=\""+(i===fotoIdx?"show":"")+"\" alt=\"\">";
      // setas só fazem sentido com mais de uma foto
      if(fotos.length>1){
        ch+="<button class=\"seta ant\" id=\"lgAnt\" aria-label=\"foto anterior\">‹</button>"+
            "<button class=\"seta prox\" id=\"lgProx\" aria-label=\"próxima foto\">›</button>";
      }
    }else{
      ch="<div style=\"display:flex;align-items:center;justify-content:center;height:100%;font-size:3rem;opacity:.3\">💍</div>";
    }
    $("lgCarrossel").innerHTML=ch;
    if(fotos.length>1){
      $("lgAnt").addEventListener("click",function(e){e.stopPropagation();passarFoto(-1);});
      $("lgProx").addEventListener("click",function(e){e.stopPropagation();passarFoto(1);});
    }
    var dh="";
    for(var j=0;j<fotos.length;j++)dh+="<span class=\""+(j===fotoIdx?"on":"")+"\" data-i=\""+j+"\"></span>";
    $("lgDots").innerHTML=dh;
    $("lgMdNome").textContent=p.nome;
    $("lgMdPreco").textContent=fmtR(p.preco);
    // etiquetas: material, tipo e as coleções da peça
    var tags=[];
    if(p.cat)tags.push(p.cat);
    if(p.tipo)tags.push(p.tipo);
    for(var c=0;c<(p.cols||[]).length;c++)tags.push(p.cols[c]);
    var th="";
    for(var ti=0;ti<tags.length;ti++)th+="<span>"+esc(tags[ti])+"</span>";
    $("lgMdTags").innerHTML=th;
    $("lgMdEsgotado").innerHTML=p.esgotado?"<div class=\"esgot-aviso\">No momento sem estoque — chame no WhatsApp pra saber quando chega.</div>":"";
    $("lgMdDesc").textContent=p.descricao||"";
    if(p.variacoes&&p.variacoes.length){
      var tw="";
      for(var k=0;k<p.variacoes.length;k++){
        var t=p.variacoes[k];
        tw+="<button class=\""+(t===tamSel?"on":"")+"\" data-tam=\""+esc(t)+"\">"+esc(t)+"</button>";
      }
      $("lgMdTamWrap").innerHTML="<div style=\"font-size:.78rem;color:var(--texto2);margin-bottom:.35rem\">Tamanho</div><div class=\"tam-wrap\">"+tw+"</div>";
    }else{
      $("lgMdTamWrap").innerHTML="";
    }
    $("lgQtd").textContent=qtd;
    $("lgBtAdd").disabled=!!p.esgotado;
    $("lgBtAdd").textContent=p.esgotado?"Indisponível no momento":"Adicionar ao pedido";
  }

  $("lgFechar").addEventListener("click",fecharModal);
  $("lgOverlay").addEventListener("click",function(e){if(e.target===this)fecharModal();});
  /* avança/volta circulando: da última vai pra primeira e vice-versa */
  function passarFoto(n){
    if(!atual||!atual.fotos||atual.fotos.length<2)return;
    var t=atual.fotos.length;
    fotoIdx=(fotoIdx+n+t)%t;
    renderModal();
  }
  // tocar na foto continua avançando (é o gesto natural no celular)
  $("lgCarrossel").addEventListener("click",function(){passarFoto(1);});
  // e no computador as setas do teclado também funcionam
  document.addEventListener("keydown",function(e){
    if(!atual)return;
    if(e.key==="ArrowRight")passarFoto(1);
    else if(e.key==="ArrowLeft")passarFoto(-1);
    else if(e.key==="Escape")fecharModal();
  });
  $("lgDots").addEventListener("click",function(e){
    var d=e.target.closest("span");if(!d)return;
    fotoIdx=parseInt(d.getAttribute("data-i"),10)||0;renderModal();
  });
  $("lgMdTamWrap").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    tamSel=b.getAttribute("data-tam");renderModal();
  });
  $("lgQtdMenos").addEventListener("click",function(){if(qtd>1){qtd--;$("lgQtd").textContent=qtd;}});
  $("lgQtdMais").addEventListener("click",function(){qtd++;$("lgQtd").textContent=qtd;});

  $("lgBtAdd").addEventListener("click",function(){
    if(!atual||atual.esgotado)return;
    var chave=atual.id+"|"+tamSel;
    var existente=null;
    for(var i=0;i<carrinho.length;i++)if(carrinho[i].chave===chave){existente=carrinho[i];break;}
    if(existente)existente.qtd+=qtd;
    else carrinho.push({chave:chave,id:atual.id,nome:atual.nome,preco:atual.preco,tamanho:tamSel,foto:(atual.fotos&&atual.fotos[0])||"",qtd:qtd});
    salvarCarrinho();fecharModal();abrirCarrinho();
  });

  function atualizarFab(){
    var n=0;for(var i=0;i<carrinho.length;i++)n+=carrinho[i].qtd;
    $("lgFabN").textContent=n;
    $("lgFab").className="fab"+(n>0?" show":"");
  }

  function renderCarrinho(){
    if(!carrinho.length){
      $("lgCarrItens").innerHTML="<p style=\"color:#b3a88f;font-size:.85rem\">Seu pedido está vazio. Escolha alguma peça no catálogo.</p>";
      $("lgCarrTotal").textContent=fmtR(0);
      return;
    }
    var h="",total=0;
    for(var i=0;i<carrinho.length;i++){
      var it=carrinho[i];total+=it.preco*it.qtd;
      var foto=it.foto?("<img src=\""+esc(it.foto)+"\" alt=\"\">"):"<div style=\"width:52px;height:52px;background:#000;border-radius:8px\"></div>";
      h+="<div class=\"carr-item\" data-idx=\""+i+"\">"+foto+
         "<div style=\"flex:1\">"+
           "<div class=\"nm\">"+esc(it.nome)+"</div>"+
           (it.tamanho?"<div class=\"tam\">Tam.: "+esc(it.tamanho)+"</div>":"")+
           "<div class=\"qtd\"><button data-acao=\"menos\">−</button><span>"+it.qtd+"</span><button data-acao=\"mais\">+</button></div>"+
         "</div><button class=\"rm\" data-acao=\"remover\">✕</button></div>";
    }
    $("lgCarrItens").innerHTML=h;
    $("lgCarrTotal").textContent=fmtR(total);
  }

  $("lgCarrItens").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    var row=e.target.closest(".carr-item");
    var idx=parseInt(row.getAttribute("data-idx"),10);
    var acao=b.getAttribute("data-acao");
    if(acao==="remover")carrinho.splice(idx,1);
    else if(acao==="mais")carrinho[idx].qtd++;
    else if(acao==="menos"){carrinho[idx].qtd--;if(carrinho[idx].qtd<=0)carrinho.splice(idx,1);}
    salvarCarrinho();renderCarrinho();
  });

  function abrirCarrinho(){renderCarrinho();$("lgCarrinhoOverlay").classList.add("show");}
  function fecharCarrinho(){$("lgCarrinhoOverlay").classList.remove("show");}
  $("lgFab").addEventListener("click",abrirCarrinho);
  $("lgFecharCarr").addEventListener("click",fecharCarrinho);
  $("lgCarrinhoOverlay").addEventListener("click",function(e){if(e.target===this)fecharCarrinho();});

  $("lgBtEnviar").addEventListener("click",function(){
    if(!carrinho.length)return;
    var wpp=(loja.whatsapp||"").replace(/\D/g,"");
    if(!wpp){alert("Número de WhatsApp da loja não configurado.");return;}
    var linhas=["Olá! Vim pelo catálogo e quero pedir:",""];
    var total=0;
    for(var i=0;i<carrinho.length;i++){
      var it=carrinho[i];total+=it.preco*it.qtd;
      linhas.push("• "+it.qtd+"x "+it.nome+(it.tamanho?" (tam. "+it.tamanho+")":"")+" — "+fmtR(it.preco*it.qtd));
    }
    linhas.push("");linhas.push("Total estimado: "+fmtR(total));
    var url="https://wa.me/"+wpp+"?text="+encodeURIComponent(linhas.join("\n"));
    window.open(url,"_blank");
  });

  render();atualizarFab();

  /* ------------------------------------------------------------
     Busca a vitrine atualizada direto do banco.
     O catálogo embutido acima é o que aparece de imediato (e o que
     salva a página se a internet falhar); em seguida esta busca traz
     a versão de agora — vendeu a última peça no painel, some daqui.
     A tabela lida aqui só tem o que o cliente pode ver: nunca custo,
     fornecedor ou estoque.
     ------------------------------------------------------------ */
  (function(){
    var N=CATALOGO.nuvem;
    if(!N||!N.url||!N.chave)return;
    fetch(N.url+"/rest/v1/catalogo?id=eq.unico&select=dados",{headers:{apikey:N.chave}})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(linhas){
        if(!linhas||!linhas.length||!linhas[0].dados)return;
        var novo=linhas[0].dados;
        if(!novo.produtos)return;
        // guarda a nuvem: o registro salvo no banco não carrega essas chaves
        novo.nuvem=N;
        CATALOGO=novo;
        absorverCatalogo();   // sem isto, a tela continua com a lista antiga
        // um filtro escolhido antes pode não existir mais na vitrine nova
        if(estado.cat&&categorias.indexOf(estado.cat)<0)estado.cat="";
        if(estado.col&&!colecoes.some(function(c){return c.nome===estado.col;}))estado.col="";
        render();
      })
      .catch(function(){/* sem internet: fica o que já está na tela */});
  })();
})();
</script>
</body>
</html>
